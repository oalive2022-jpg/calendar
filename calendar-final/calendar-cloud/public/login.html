<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 月間カレンダー ログイン</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #eef2f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'Hiragino Sans', 'Meiryo', sans-serif; }
.card { background: white; border-radius: 20px; padding: 40px 36px 36px; width: 92%; max-width: 380px; box-shadow: 0 6px 30px rgba(0,0,0,0.10); }
.logo { text-align: center; font-size: 52px; margin-bottom: 8px; }
h1 { text-align: center; font-size: 19px; font-weight: 700; color: #0C447C; margin-bottom: 4px; }
.sub { text-align: center; font-size: 12px; color: #999; margin-bottom: 28px; }
label { font-size: 13px; font-weight: 600; color: #444; display: block; margin-bottom: 5px; margin-top: 14px; }
label:first-of-type { margin-top: 0; }
.pw-wrap { position: relative; }
input[type="text"], input[type="password"] {
  width: 100%; height: 48px; border: 1.5px solid #c8d8ea; border-radius: 10px;
  padding: 0 44px 0 14px; font-size: 16px; outline: none; transition: border-color .2s;
}
input:focus { border-color: #378ADD; }
.toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: #aaa; font-size: 18px; padding: 4px; }
.btn-login { width: 100%; height: 50px; background: #185FA5; color: white; border: none;
  border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 22px; transition: background .2s; }
.btn-login:hover { background: #0C447C; }
.btn-login:active { background: #042C53; }
.error { background: #FAECE7; color: #7a1a0a; border-radius: 8px; padding: 10px 14px;
  font-size: 13px; margin-bottom: 16px; display: none; text-align: center; }
.error.show { display: block; }
.loading { opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">📅</div>
  <h1>月間カレンダー</h1>
  <p class="sub">ユーザー名とパスワードでログイン</p>
  <div class="error" id="err-msg">ユーザー名またはパスワードが違います</div>
  <label>ユーザー名</label>
  <input type="text" id="username" placeholder="ユーザー名を入力" autocomplete="username">
  <label>パスワード</label>
  <div class="pw-wrap">
    <input type="password" id="password" placeholder="パスワードを入力" autocomplete="current-password">
    <button class="toggle-pw" onclick="togglePw()" type="button" tabindex="-1">👁</button>
  </div>
  <button class="btn-login" id="login-btn" onclick="doLogin()">ログイン</button>
</div>
<script>
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
function togglePw() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return;
  const btn = document.getElementById('login-btn');
  btn.classList.add('loading'); btn.textContent = '確認中...';
  document.getElementById('err-msg').classList.remove('show');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.ok) {
      sessionStorage.setItem('cal-token', data.token);
      sessionStorage.setItem('cal-role', data.role);
      sessionStorage.setItem('cal-name', data.name);
      location.href = data.role === 'admin' ? '/admin.html' : '/calendar.html';
    } else throw new Error();
  } catch {
    document.getElementById('err-msg').classList.add('show');
    btn.classList.remove('loading'); btn.textContent = 'ログイン';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
}
</script>
</body>
</html>
